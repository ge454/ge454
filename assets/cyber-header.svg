<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
<title id="title">Geovani Rodrigues de Almeida — Cibersegurança e Inteligência Artificial</title>
<desc id="desc">Banner em azul escuro com detalhes em verde neon e ciano. Um escudo e uma rede de conexões recebem animações suaves.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0d1b2d"/></linearGradient>
 <linearGradient id="accent"><stop stop-color="#34f5a3"/><stop offset="1" stop-color="#38d9ff"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#38d9ff" stroke-opacity=".06"/></pattern>
 <clipPath id="clip"><rect x="1" y="1" width="1098" height="328" rx="18"/></clipPath>
</defs>
<style>
 .pulse{animation:pulse 3s ease-in-out infinite}
 .cursor{animation:blink 1.2s steps(2,end) infinite}
 .flow{stroke-dasharray:5 12;animation:flow 7s linear infinite}
 .scan{animation:scan 6s ease-in-out infinite}
 @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
 @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
 @keyframes flow{to{stroke-dashoffset:-170}}
 @keyframes scan{0%,100%{transform:translateY(0);opacity:0}20%,80%{opacity:.6}90%{transform:translateY(240px);opacity:0}}
 @media(prefers-reduced-motion:reduce){.pulse,.cursor,.flow,.scan{animation:none}}
</style>
<g clip-path="url(#clip)">
 <rect width="1100" height="330" fill="url(#bg)"/>
 <rect width="1100" height="330" fill="url(#grid)"/>
 <path d="M0 2H1100" stroke="url(#accent)" stroke-width="4"/>
 <path d="M0 50H1100" stroke="#34f5a3" stroke-opacity=".2" class="scan"/>
 <g font-family="'Segoe UI',Arial,sans-serif">
  <rect x="38" y="31" width="215" height="27" rx="13" fill="#34f5a3" fill-opacity=".08" stroke="#34f5a3" stroke-opacity=".3"/>
  <circle cx="54" cy="44" r="3" fill="#34f5a3" class="pulse"/>
  <text x="66" y="49" font-size="11" letter-spacing="1.6" fill="#34f5a3">APRENDER · CRIAR · INVESTIGAR</text>
  <text x="38" y="116" font-size="47" font-weight="700" fill="#f0f6fc">GEOVANI</text>
  <text x="40" y="147" font-size="19" letter-spacing="4" fill="#9aafc7">RODRIGUES DE ALMEIDA</text>
  <text x="40" y="198" font-size="24" font-weight="600" fill="#34f5a3">CIBERSEGURANÇA <tspan fill="#536980">×</tspan> <tspan fill="#38d9ff">INTELIGÊNCIA ARTIFICIAL</tspan></text>
  <text x="40" y="232" font-size="16" fill="#aebed0">Python · Pentest · Blue Team · CTFs &amp; Wargames</text>
  <text x="40" y="290" font-family="Consolas,monospace" font-size="14" fill="#6f879f">&gt; construindo minha trajetória em segurança<tspan fill="#34f5a3" class="cursor">_</tspan></text>
 </g>
 <g transform="translate(919 160)" fill="none">
  <circle r="111" stroke="#38d9ff" stroke-opacity=".1"/>
  <circle r="85" stroke="#34f5a3" stroke-opacity=".18" stroke-dasharray="3 10"/>
  <path d="M-114 -65L0 -101L111 -57L103 66L0 108L-108 62Z" stroke="#38d9ff" stroke-opacity=".25"/>
  <path d="M-114 -65L0 -101L111 -57L103 66L0 108L-108 62Z" stroke="#38d9ff" stroke-opacity=".7" class="flow"/>
  <path d="M0 -64L48 -43V0C48 35 20 54 0 65C-20 54 -48 35 -48 0V-43Z" fill="#34f5a3" fill-opacity=".05" stroke="url(#accent)" stroke-width="2.5"/>
  <rect x="-20" y="-6" width="40" height="31" rx="5" stroke="#34f5a3" stroke-width="2"/>
  <path d="M-12 -6V-18a12 12 0 0 1 24 0V-6" stroke="#38d9ff" stroke-width="2"/>
  <circle cy="7" r="3" fill="#34f5a3"/>
  <path d="M0 10V16" stroke="#34f5a3" stroke-width="2"/>
  <g fill="#38d9ff" class="pulse"><circle cx="-114" cy="-65" r="4"/><circle cy="-101" r="4"/><circle cx="111" cy="-57" r="4"/><circle cx="103" cy="66" r="4"/><circle cy="108" r="4"/><circle cx="-108" cy="62" r="4"/></g>
 </g>
</g>
<rect x="1" y="1" width="1098" height="328" rx="18" fill="none" stroke="#25415a"/>
</svg>
